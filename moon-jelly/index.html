<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>海月水母館</title>
<meta name="description" content="一座只屬於你的夜光水母缸：把煩惱餵給水母、和牠們一起呼吸、孕育從沒見過的新水母。">
<meta name="theme-color" content="#193d54">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500&family=Cactus+Classical+Serif&family=Iansui&family=IBM+Plex+Mono:wght@400;500&family=EB+Garamond:ital@1&display=swap">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/sea.css">
<link rel="stylesheet" href="css/sheet.css">
<link rel="stylesheet" href="css/paper.css">
<link rel="stylesheet" href="css/ritual.css">
</head>
<body class="intro">
<!--BODY-->
<canvas id="sea" aria-label="水族箱。點水面可以餵食，按住水母滑動可以摸摸牠。"></canvas>

<header id="hud" class="hud">
  <div class="hud-id">
    <p class="hud-name">海月水母館</p>
    <p class="hud-light" title="光：水母發出的光，在商店使用"><span class="light-dot" aria-hidden="true"></span><span class="hud-k">光</span><span id="lightNum" class="num hud-num">0</span><span id="lightRate" class="num hud-rate">+0/小時</span></p>
  </div>
  <nav class="hud-actions" aria-label="館內">
    <button class="hud-btn" id="btnLetter" hidden aria-label="來信：今天的信，未拆">來信</button>
    <button class="hud-btn" id="btnSound" aria-pressed="true">聲音 開</button>
    <button class="hud-btn" id="btnSettings">設定</button>
  </nav>
</header>

<div id="toasts" class="toasts" aria-live="polite"></div>

<div id="hint" class="hint" hidden><p id="hintText" class="hint-text"></p><button id="hintClose" class="btn-2" aria-label="知道了，不再顯示提示">知道了</button></div>

<div id="feedPop" class="feed-menu" aria-hidden="true"></div>

<nav id="dock" class="dock" aria-label="主要功能">
  <button class="dock-item" data-act="feed"><span class="lbl">餵食</span></button>
  <button class="dock-item" data-act="breath"><span class="lbl">呼吸</span></button>
  <button class="dock-item" data-act="codex"><span class="lbl">圖鑑</span></button>
  <button class="dock-item" data-act="shop"><span class="lbl">商店</span></button>
  <button class="dock-item" data-act="more"><span class="lbl">更多</span></button>
  <button class="dock-mood" data-act="worry"><span class="lbl">心情</span></button>
</nav>

<aside id="sheet" class="sheet" role="dialog" aria-label="">
  <header class="sheet-head">
    <button class="icon-btn sm" id="sheetBack" hidden aria-label="上一頁" data-icon="back"></button>
    <h2 id="sheetTitle"></h2>
    <button class="icon-btn sm" id="sheetClose" aria-label="關閉" data-icon="close"></button>
  </header>
  <div id="sheetBody" class="sheet-body"></div>
</aside>

<div id="breathUI" class="breath-ui" hidden>
  <div class="breath-stage">
    <div id="breathRing" class="breath-ring"></div>
    <div class="breath-text">
      <p id="breathWord" class="breath-word">吸氣</p>
      <p id="breathCount" class="num breath-count">4</p>
    </div>
  </div>
  <p id="breathCycle" class="breath-cycle"></p>
  <button id="breathStop" class="btn-3">結束</button>
</div>

<div id="sleepUI" class="sleep-ui" hidden>
  <p id="sleepClock" class="num sleep-clock">00:00</p>
  <p id="sleepLine" class="sleep-line"></p>
  <p id="sleepSub" class="sleep-sub"></p>
  <button id="sleepStop" class="btn-3">醒來</button>
</div>

<div id="photoUI" class="photo-ui" hidden>
  <button id="photoClose" class="btn-3 photo-back">返回</button>
  <button id="photoShot" class="shutter" aria-label="拍照"></button>
</div>
<div id="flash" class="flash" aria-hidden="true"></div>

<div id="arrangeBar" class="arrange-bar" hidden>
  <p class="arrange-text">左右拖曳裝飾：調整位置</p>
  <button id="arrangeDone" class="btn">完成</button>
</div>

<section id="ritual" class="ritual" hidden role="dialog" aria-modal="true" aria-labelledby="ritualTitle">
  <div class="ritual-card">
    <header class="ritual-head">
      <ol id="ritualSteps" class="ritual-steps" aria-label="步驟"></ol>
      <button class="icon-btn sm" id="ritualClose" aria-label="先不要" data-icon="close"></button>
    </header>
    <div id="ritualBody" class="ritual-body"></div>
  </div>
</section>

<svg id="leader" class="leader" aria-hidden="true"><polyline id="leaderLine" pathLength="1" points="0,0 0,0"/><circle id="leaderRing" cx="0" cy="0" r="16"/></svg>

<div id="modal" class="modal" hidden><div id="modalCard" class="modal-card" role="dialog" aria-modal="true" tabindex="-1"></div></div>

<section id="intro" class="intro-screen">
  <div class="intro-inner">
    <h1 class="intro-title">海月水母館</h1>
    <p class="intro-sub" id="introSub">現正展出</p>
    <button id="introStart" class="btn">入館</button>
    <p class="intro-note">有聲音。建議戴耳機。</p>
  </div>
</section>
<!--/BODY-->

<script src="js/util.js"></script>
<script src="js/content.js"></script>
<script src="js/genes.js"></script>
<script src="js/feelings.js"></script>
<script src="js/audio.js"></script>
<script src="js/fx.js"></script>
<script src="js/world.js"></script>
<script src="js/decor.js"></script>
<script src="js/jelly.js"></script>
<script src="js/polyp.js"></script>
<script src="js/food.js"></script>
<script src="js/creatures.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/ui-sheets.js"></script>
<script src="js/ui-paper.js"></script>
<script src="js/ui-eco.js"></script>
<script src="js/ritual.js"></script>
<script src="js/tides.js"></script>
<script src="js/game.js"></script>
<script>MJ.Game.init();</script>
</body>
</html>
